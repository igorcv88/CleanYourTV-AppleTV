plugins {
    id 'com.android.application'
}

def signedRelease = providers.gradleProperty('releaseKeystore').orNull
def releaseSecrets = new Properties()
if (signedRelease != null) {
    // A GitHub Actions runner writes the four repository secrets to an ephemeral properties file.
    // Local builds keep the upstream debug key so the existing rollback/testing flow still works.
    file(signedRelease).withInputStream { releaseSecrets.load(it) }
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    sourceSets {
        main {
            // Ship the upstream theme catalog without keeping duplicate copies under launcher/.
            // Previews and wallpapers are decoded only when the picker or selected theme needs them.
            assets.srcDirs += ['../../themes']
        }
    }

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist.
        // Xiaomi: docs/devices/xiaomi-mitv-aetp0-dofus.md (com.ts.launcher).
        // ColorOS TV: docs/devices/oppo-k9-55-oppocnm632.md (com.oneplus.tv.launcher2).
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode providers.gradleProperty('releaseVersionCode').map { it.toInteger() }.getOrElse(12)
        versionName providers.gradleProperty('releaseVersionName').getOrElse('3.3')
    }

    signingConfigs {
        if (signedRelease != null) {
            signedTvRelease {
                storeFile file(releaseSecrets.getProperty('storeFile'))
                storePassword releaseSecrets.getProperty('storePassword')
                keyAlias releaseSecrets.getProperty('keyAlias')
                keyPassword releaseSecrets.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signedRelease == null ? signingConfigs.debug : signingConfigs.signedTvRelease
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
