name: Build APK Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        required: true
        default: beta
        options:
          - beta
          - stable

permissions:
  contents: write

concurrency:
  group: scenic-glass-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, sign, verify and publish Android TV APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out main and release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Configure Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Choose the next release version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          # Fork's first Scenic Glass release: 1.3.0; later patches increment.
          # Reserve 999 in each versionCode block for stable; betas use 1..998.
          last_stable=-1
          last_beta_patch=-1
          last_beta_seq=0
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v1[.]3[.]([0-9]+)$ ]]; then
              patch=$((10#${BASH_REMATCH[1]}))
              if (( patch > last_stable )); then
                last_stable=$patch
              fi
            elif [[ "$tag" =~ ^v1[.]3[.]([0-9]+)-beta-([0-9]+)$ ]]; then
              patch=$((10#${BASH_REMATCH[1]}))
              seq=$((10#${BASH_REMATCH[2]}))
              if (( patch > last_beta_patch || (patch == last_beta_patch && seq > last_beta_seq) )); then
                last_beta_patch=$patch
                last_beta_seq=$seq
              fi
            fi
          done < <(git tag --list 'v1.3.*')

          case "$CHANNEL" in
            beta)
              if (( last_beta_patch > last_stable )); then
                patch=$last_beta_patch
                seq=$((last_beta_seq + 1))
              else
                patch=$((last_stable + 1))
                seq=1
              fi
              (( seq <= 998 )) || { echo 'Beta sequence exhausted' >&2; exit 1; }
              version="1.3.${patch}-beta-${seq}"
              code=$((130000 + patch * 1000 + seq))
              prerelease=true
              ;;
            stable)
              if (( last_beta_patch > last_stable )); then
                patch=$last_beta_patch
              else
                patch=$((last_stable + 1))
              fi
              version="1.3.${patch}"
              code=$((130000 + patch * 1000 + 999))
              prerelease=false
              ;;
            *) echo "Unsupported channel: $CHANNEL" >&2; exit 1 ;;
          esac

          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi
          (( code <= 2100000000 )) || exit 1
          {
            echo "version=$version"
            echo "code=$code"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Building $tag (Android versionCode $code, prerelease=$prerelease)" >> "$GITHUB_STEP_SUMMARY"

      - name: Decode and validate signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "Missing GitHub secret: $name" >&2; exit 1; }
          done

          keystore="$RUNNER_TEMP/scenic-glass-release.jks"
          properties="$RUNNER_TEMP/scenic-glass-keystore.properties"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value):
              for char, replacement in [('\\', '\\\\'), ('\n', '\\n'), ('\r', '\\r'), ('=', '\\='), (':', '\\:'), ('#', '\\#'), ('!', '\\!')]:
                  value = value.replace(char, replacement)
              return value

          settings = {
              'storeFile': str(Path(os.environ['RUNNER_TEMP']) / 'scenic-glass-release.jks'),
              'storePassword': os.environ['KEYSTORE_PASSWORD'],
              'keyAlias': os.environ['KEY_ALIAS'],
              'keyPassword': os.environ['KEY_PASSWORD'],
          }
          Path(os.environ['RUNNER_TEMP'], 'scenic-glass-keystore.properties').write_text(
              ''.join(f'{key}={escape(value)}\n' for key, value in settings.items()),
              encoding='ascii',
          )
          PY

          keytool -list -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          expected_sha="$(keytool -list -v -keystore "$keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ -n "$expected_sha" ]] || { echo 'Signing certificate not readable' >&2; exit 1; }
          echo "properties=$properties" >> "$GITHUB_OUTPUT"
          echo "cert_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: JVM tests, lint and signed release build
        working-directory: launcher
        env:
          RELEASE_PROPERTIES: ${{ steps.signing.outputs.properties }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease \
            -PreleaseKeystore="$RELEASE_PROPERTIES" \
            -PreleaseVersionName="$VERSION" \
            -PreleaseVersionCode="$VERSION_CODE"

      - name: Verify package, version, signature and checksum
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          EXPECTED_CERT_SHA: ${{ steps.signing.outputs.cert_sha }}
        run: |
          set -euo pipefail
          source_apk='launcher/app/build/outputs/apk/release/app-release.apk'
          [[ -s "$source_apk" ]] || { echo 'Release APK missing' >&2; exit 1; }
          apksigner="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/34.0.0/aapt"
          [[ -x "$apksigner" && -x "$aapt" ]] || { echo 'Android build-tools 34 missing' >&2; exit 1; }
          signature="$($apksigner verify --verbose --print-certs "$source_apk")"
          if grep -qi 'CN=Android Debug' <<< "$signature"; then
            echo 'Refusing to publish a debug-signed APK' >&2
            exit 1
          fi
          actual_cert="$(awk '/^(Signer #[0-9]+ |V[0-9.]+ Signer: )certificate SHA-256 digest:/{print $NF; exit}' <<< "$signature" \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ -n "$actual_cert" && "$actual_cert" == "$EXPECTED_CERT_SHA" ]] || {
            echo 'APK signature differs from the configured release key' >&2; exit 1;
          }

          badging="$($aapt dump badging "$source_apk" | head -n 1)"
          [[ "$badging" == *"name='com.gathin.tvhome'"* ]] || { echo 'Wrong application ID' >&2; exit 1; }
          [[ "$badging" == *"versionCode='$VERSION_CODE'"* ]] || { echo 'Wrong versionCode' >&2; exit 1; }
          [[ "$badging" == *"versionName='$VERSION'"* ]] || { echo 'Wrong versionName' >&2; exit 1; }

          mkdir -p release
          name="ScenicGlassTV-v${VERSION}.apk"
          cp "$source_apk" "release/$name"
          (cd release && sha256sum "$name" > "$name.sha256")
          echo "apk=release/$name" >> "$GITHUB_OUTPUT"
          echo "checksum=release/$name.sha256" >> "$GITHUB_OUTPUT"
          {
            echo '### Verified release'
            echo "- Package: com.gathin.tvhome"
            echo "- Version: $VERSION ($VERSION_CODE)"
            echo '- Unit tests and Android lint: passed'
            echo '- Release certificate: matched configured keystore'
            echo "- SHA-256: $(sha256sum "release/$name" | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package CleanYourTV optimization and Home setup toolkit
        id: kit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          set -euo pipefail
          name="ScenicGlassTV-v${VERSION}-Setup"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage/installer" "$stage/launcher" "$stage/tools"
          cp "$APK" "$stage/ScenicGlassTV.apk"
          cp installer/setup.sh installer/setup.ps1 "$stage/installer/"
          cp installer/README.md "$stage/README.md"
          cp launcher/build-and-install.sh launcher/build-and-install.ps1 "$stage/launcher/"
          cp tools/tv.py tools/b64push.py tools/recovery.py tools/adb-closed.py tools/requirements.txt \
            tools/disable.sh tools/disable.ps1 tools/restore.sh tools/restore.ps1 "$stage/tools/"
          cp -R examples "$stage/examples"
          cp PROMPT.md LICENSE "$stage/"
          chmod +x "$stage/installer/setup.sh" "$stage/launcher/build-and-install.sh" \
            "$stage/tools/disable.sh" "$stage/tools/restore.sh"
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/release/$name.zip" "$name")
          unzip -tq "release/$name.zip"
          (cd release && sha256sum "$name.zip" > "$name.zip.sha256")
          echo "zip=release/$name.zip" >> "$GITHUB_OUTPUT"
          echo "checksum=release/$name.zip.sha256" >> "$GITHUB_OUTPUT"
          echo "- Setup kit: $name.zip (APK, model profiles, debloat, restore and Home installer)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          APK: ${{ steps.apk.outputs.apk }}
          CHECKSUM: ${{ steps.apk.outputs.checksum }}
          SETUP_ZIP: ${{ steps.kit.outputs.zip }}
          SETUP_SHA: ${{ steps.kit.outputs.checksum }}
        run: |
          set -euo pipefail
          notes=$'**Download recomendado:** `ScenicGlassTV-*-Setup.zip`. Extraia no computador e leia `README.md` para instalar a Home e aplicar as otimizações CleanYourTV com backup/rollback.\n\nO debloat só é oferecido quando o perfil corresponde exatamente ao firmware da TV e requer confirmação. Um perfil de outro modelo pode comprometer HDMI, Chromecast ou funções do fabricante.\n\n**Alternativa:** use o `.apk` avulso apenas para instalar o launcher, sem otimizações. Os arquivos `.sha256` permitem conferir os downloads.'
          args=(release create "$TAG" "$APK" "$CHECKSUM" "$SETUP_ZIP" "$SETUP_SHA" \
            --target "$GITHUB_SHA" --title "Scenic Glass TV $VERSION" --generate-notes --notes "$notes")
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh "${args[@]}"
          gh release view "$TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/scenic-glass-release.jks" "$RUNNER_TEMP/scenic-glass-keystore.properties"
